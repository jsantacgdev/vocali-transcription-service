service: vocali-transcriptions
frameworkVersion: "4"

provider:
  name: aws
  runtime: nodejs20.x
  region: eu-west-1
  stage: ${opt:stage, 'dev'}
  memorySize: 512
  timeout: 29
  logRetentionInDays: 7
  environment:
    STAGE: ${self:provider.stage}
    TABLE_NAME: !Ref TranscriptionsTable
    BUCKET_NAME: !Ref AudioBucket
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:GetItem
            - dynamodb:Query
          Resource: !GetAtt TranscriptionsTable.Arn
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
          Resource: !Sub '${AudioBucket.Arn}/*'
  httpApi:
    authorizers:
      cognitoJwt:
        type: jwt
        identitySource: $request.header.Authorization
        issuerUrl: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
        audience:
          - !Ref UserPoolClient

functions:
  createTranscription:
    handler: src/infrastructure/lambda/http/createTranscription.handler
    events:
      - httpApi:
          path: /transcriptions
          method: post
          authorizer:
            name: cognitoJwt
  onAudioUploaded:
    handler: src/infrastructure/lambda/events/onAudioUploaded.handler
    timeout: 300
    environment:
      SPEECHMATICS_API_KEY: ${env:SPEECHMATICS_API_KEY}
    events:
      - s3:
          bucket: !Ref AudioBucket
          event: s3:ObjectCreated:*
          rules:
            - prefix: audio/
          existing: true
  listTranscriptions:
    handler: src/infrastructure/lambda/http/listTranscriptions.handler
    events:
      - httpApi:
          path: /transcriptions
          method: get
          authorizer:
            name: cognitoJwt
  me:
    handler: src/infrastructure/lambda/http/me.handler
    events:
      - httpApi:
          path: /me
          method: get
          authorizer:
            name: cognitoJwt

resources:
  Resources:
    TranscriptionsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-transcriptions-${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: PK
            AttributeType: S
          - AttributeName: SK
            AttributeType: S
        KeySchema:
          - AttributeName: PK
            KeyType: HASH
          - AttributeName: SK
            KeyType: RANGE
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: false

    AudioBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:service}-audio-${self:provider.stage}-${aws:accountId}
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        CorsConfiguration:
          CorsRules:
            - AllowedMethods: [GET, PUT]
              AllowedOrigins: ["*"]
              AllowedHeaders: ["*"]
              ExposedHeaders: [ETag]
              MaxAge: 3000
        LifecycleConfiguration:
          Rules:
            - Id: DeleteOldAudio
              Status: Enabled
              ExpirationInDays: 7

    UserPool:
      Type: AWS::Cognito::UserPool
      Properties:
        UserPoolName: ${self:service}-users-${self:provider.stage}
        UsernameAttributes: [email]
        AutoVerifiedAttributes: [email]
        Policies:
          PasswordPolicy:
            MinimumLength: 8
            RequireLowercase: true
            RequireUppercase: true
            RequireNumbers: true
            RequireSymbols: false
        AccountRecoverySetting:
          RecoveryMechanisms:
            - Name: verified_email
              Priority: 1

    UserPoolClient:
      Type: AWS::Cognito::UserPoolClient
      Properties:
        ClientName: ${self:service}-web-${self:provider.stage}
        UserPoolId: !Ref UserPool
        GenerateSecret: false
        ExplicitAuthFlows:
          - ALLOW_USER_SRP_AUTH
          - ALLOW_REFRESH_TOKEN_AUTH
          - ALLOW_ADMIN_USER_PASSWORD_AUTH
          - ALLOW_USER_PASSWORD_AUTH
        AccessTokenValidity: 60
        IdTokenValidity: 60
        RefreshTokenValidity: 30
        TokenValidityUnits:
          AccessToken: minutes
          IdToken: minutes
          RefreshToken: days

  Outputs:
    UserPoolId:
      Value: !Ref UserPool
    UserPoolClientId:
      Value: !Ref UserPoolClient
    AudioBucketName:
      Value: !Ref AudioBucket
    TranscriptionsTableName:
      Value: !Ref TranscriptionsTable
